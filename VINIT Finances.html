<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Finance Ledger</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
  /* Layout: net-worth + month ledger band, two analysis panels, then tabbed ruled lists; all create/edit/delete in modal sheets. */
  :root {
    --bg: #F3F7F7;
    --surface: #FFFFFF;
    --surface-2: #EAF1F1;
    --fg: #13222A;
    --muted: #566A72;
    --line: #D5E1E2;
    --accent: #0E9899;
    --accent-strong: #087374;
    --accent-ink: #FFFFFF;
    --accent-2: #35398C;
    --focus: #35398C;
    --ok-bg: #DDF3EA;   --ok-fg: #0B6B47;
    --warn-bg: #FBEFD2; --warn-fg: #7A5200;
    --info-bg: #E4E5F6; --info-fg: #35398C;
    --neutral-bg: #E8EDEE; --neutral-fg: #44565D;
    --pause-bg: #F1E3E3; --pause-fg: #8A3A3A;
    --danger: #B3261E;
    --danger-ink: #FFFFFF;
    --c-in: #0E9899;     /* chart: income */
    --c-out: #D0702A;    /* chart: expenses */
    --c-inv: #5157B8;    /* chart: invested */
    --shadow: 0 1px 2px rgba(19,34,42,.06), 0 12px 32px rgba(19,34,42,.10);
    --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
    --font-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0B1416; --surface: #111D20; --surface-2: #172528; --fg: #E4EEF0; --muted: #8EA5AB; --line: #233639;
      --accent: #2CC4C5; --accent-strong: #2CC4C5; --accent-ink: #04201F; --accent-2: #9DA1F0; --focus: #9DA1F0;
      --ok-bg: #12362B;   --ok-fg: #6FD6A5;
      --warn-bg: #3A2D0F; --warn-fg: #EBC25E;
      --info-bg: #1F2250; --info-fg: #B3B6F5;
      --neutral-bg: #1C2B2E; --neutral-fg: #A9BCC1;
      --pause-bg: #3A2020; --pause-fg: #F0A8A8;
      --danger: #F08A84; --danger-ink: #2A0B0A;
      --c-in: #1FA8A9; --c-out: #C97A38; --c-inv: #7C82DE;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 12px 32px rgba(0,0,0,.45);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0B1416; --surface: #111D20; --surface-2: #172528; --fg: #E4EEF0; --muted: #8EA5AB; --line: #233639;
    --accent: #2CC4C5; --accent-strong: #2CC4C5; --accent-ink: #04201F; --accent-2: #9DA1F0; --focus: #9DA1F0;
    --ok-bg: #12362B;   --ok-fg: #6FD6A5;
    --warn-bg: #3A2D0F; --warn-fg: #EBC25E;
    --info-bg: #1F2250; --info-fg: #B3B6F5;
    --neutral-bg: #1C2B2E; --neutral-fg: #A9BCC1;
    --pause-bg: #3A2020; --pause-fg: #F0A8A8;
    --danger: #F08A84; --danger-ink: #2A0B0A;
    --c-in: #1FA8A9; --c-out: #C97A38; --c-inv: #7C82DE;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 12px 32px rgba(0,0,0,.45);
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font-body);
    font-size: 15px;
    line-height: 1.5;
    padding-block: 30px 72px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .wrap { max-width: 1080px; margin: 0 auto; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .num { font-variant-numeric: tabular-nums; }

  /* Header */
  .top { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 22px; }
  .eyebrow { margin: 0 0 4px; font-size: 12px; font-weight: 600; letter-spacing: .09em; text-transform: uppercase; color: var(--accent-strong); }
  h1 { margin: 0; font-family: var(--font-display); font-size: clamp(30px, 5vw, 40px); line-height: 1.08; font-weight: 700; letter-spacing: -.015em; text-wrap: balance; }
  .top-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
  .month { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
  .month button { font: inherit; font-size: 18px; line-height: 1; width: 38px; height: 38px; border: 0; background: none; color: var(--fg); cursor: pointer; border-radius: 9px; }
  .month button:hover { background: var(--surface-2); }
  .month span { min-width: 128px; text-align: center; font-weight: 600; font-size: 14px; }

  /* Overview */
  .overview { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 3fr); gap: 18px 36px; padding: 20px 0 22px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); margin-bottom: 22px; }
  .k { font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .nw .v { font-family: var(--font-display); font-size: clamp(32px, 5vw, 42px); line-height: 1.1; font-weight: 700; letter-spacing: -.01em; font-variant-numeric: tabular-nums; }
  .nw .parts { display: flex; flex-wrap: wrap; gap: 2px 14px; margin-top: 6px; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px 22px; align-content: end; }
  .stat { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .stat .v { font-family: var(--font-display); font-size: 25px; line-height: 1.15; font-weight: 600; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
  .stat .d { font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .stat .d.up-bad, .stat .d.down-bad { color: var(--pause-fg); }
  .stat .d.up-good, .stat .d.down-good { color: var(--ok-fg); }
  .sw { display: inline-block; width: 9px; height: 9px; border-radius: 3px; margin-right: 6px; vertical-align: 0; }
  @media (max-width: 860px) { .overview { grid-template-columns: minmax(0, 1fr); } }
  @media (max-width: 560px) { .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

  /* Panels */
  .panels { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 18px; margin-bottom: 28px; }
  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px 18px 16px; min-width: 0; }
  .panel-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 6px 14px; margin-bottom: 12px; }
  .panel h2 { margin: 0; font-family: var(--font-display); font-size: 18px; font-weight: 600; }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12.5px; color: var(--muted); }
  .chart-wrap { position: relative; }
  .chart-wrap svg { display: block; width: 100%; height: auto; overflow: visible; }
  .chart-wrap .axis { fill: var(--muted); font-size: 11px; font-family: var(--font-body); font-variant-numeric: tabular-nums; }
  .chart-wrap .grid { stroke: var(--line); stroke-width: 1; }
  .chart-wrap .grid.base { stroke: var(--muted); opacity: .5; }
  .chart-wrap .hit { fill: transparent; cursor: default; }
  .chart-wrap .hit:hover, .chart-wrap .hit.on { fill: var(--surface-2); opacity: .55; }
  .chart-wrap .sel { fill: var(--fg); font-weight: 700; }
  .tip { position: absolute; z-index: 5; pointer-events: none; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); padding: 9px 12px; font-size: 13px; min-width: 170px; }
  .tip b { display: block; margin-bottom: 4px; font-size: 13px; }
  .tip .tr { display: flex; justify-content: space-between; gap: 14px; font-variant-numeric: tabular-nums; }
  .tip .tr span:first-child { color: var(--muted); }
  .cats { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 11px; }
  .cat-top { display: flex; justify-content: space-between; gap: 10px; font-size: 13.5px; }
  .cat-top .lbl { font-weight: 600; min-width: 0; overflow-wrap: anywhere; }
  .cat-top .amt { color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .cat-top .amt strong { color: var(--fg); font-weight: 600; }
  .track { position: relative; height: 8px; border-radius: 99px; background: var(--surface-2); margin-top: 5px; }
  .track i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: inherit; background: var(--c-out); transition: width .4s ease; }
  .track i.over { background: var(--danger); }
  .track b { position: absolute; top: -3px; bottom: -3px; width: 2px; margin-left: -1px; border-radius: 2px; background: var(--fg); }
  .panel .quiet { color: var(--muted); font-size: 14px; margin: 6px 0 0; }
  @media (max-width: 860px) { .panels { grid-template-columns: minmax(0, 1fr); } }

  /* Tabs */
  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 16px; overflow-x: auto; scrollbar-width: none; }
  .tab { font: inherit; font-size: 14.5px; font-weight: 600; padding: 10px 14px 11px; border: 0; border-bottom: 2px solid transparent; margin-bottom: -1px; background: none; color: var(--muted); cursor: pointer; white-space: nowrap; }
  .tab:hover { color: var(--fg); }
  .tab[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent); }
  .tab .n { font-variant-numeric: tabular-nums; font-weight: 500; margin-left: 5px; color: var(--muted); }

  /* Toolbar */
  .toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 12px; margin-bottom: 14px; }
  .search { flex: 1 1 220px; min-width: 0; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { font: inherit; font-size: 13px; font-weight: 500; padding: 6px 12px; border-radius: 99px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); cursor: pointer; }
  .chip:hover { background: var(--surface-2); }
  .chip[aria-pressed="true"] { background: var(--accent-strong); border-color: var(--accent-strong); color: var(--accent-ink); }
  .toolbar select { width: auto; padding: 6px 10px; font-size: 13px; }
  .summary { display: flex; flex-wrap: wrap; gap: 4px 22px; font-size: 13.5px; color: var(--muted); margin: -4px 0 14px; font-variant-numeric: tabular-nums; }
  .summary strong { color: var(--fg); font-weight: 600; }

  /* Inputs */
  input, select, textarea { font: inherit; color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 9px 11px; width: 100%; min-width: 0; }
  input::placeholder, textarea::placeholder { color: var(--muted); opacity: .8; }
  input:focus, select:focus, textarea:focus { border-color: var(--accent); }
  textarea { resize: vertical; min-height: 76px; }
  input[type="checkbox"] { width: 18px; height: 18px; padding: 0; accent-color: var(--accent-strong); }

  /* Buttons */
  .btn { font: inherit; font-size: 14px; font-weight: 600; padding: 9px 16px; border-radius: 9px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); cursor: pointer; }
  .btn:hover { background: var(--surface-2); }
  .btn.primary { background: var(--accent-strong); border-color: var(--accent-strong); color: var(--accent-ink); }
  .btn.primary:hover { filter: brightness(1.1); }
  .btn.danger { background: var(--danger); border-color: var(--danger); color: var(--danger-ink); }
  .btn.danger:hover { filter: brightness(1.08); }
  .btn.sm { font-size: 13px; padding: 6px 12px; }
  .btn[disabled] { opacity: .6; cursor: default; }
  .link-btn { font: inherit; font-size: 13.5px; font-weight: 600; padding: 6px 8px; border: 0; border-radius: 6px; background: none; color: var(--accent-strong); cursor: pointer; white-space: nowrap; }
  .link-btn:hover { background: var(--surface-2); }
  .link-btn.del { color: var(--danger); }

  /* Lists */
  .list { list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  .row { display: grid; align-items: center; gap: 6px 18px; padding: 13px 18px; border-top: 1px solid var(--line); }
  .row > * { min-width: 0; }
  .row.head { background: var(--surface-2); border-top: 0; padding-block: 10px; font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .row.item.editable { cursor: pointer; }
  .row.item.editable:hover { background: color-mix(in srgb, var(--surface-2) 55%, var(--surface)); }
  .r-amt, .r-num { text-align: right; font-variant-numeric: tabular-nums; }
  .head .r-amt, .head .r-num { text-align: right; }
  .r-actions { display: flex; gap: 2px; justify-content: flex-end; }
  .name { font-family: var(--font-display); font-size: 16.5px; font-weight: 600; line-height: 1.25; overflow-wrap: anywhere; }
  .sub { display: block; font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
  .date { font-size: 13.5px; font-variant-numeric: tabular-nums; color: var(--muted); }
  .date strong { display: block; color: var(--fg); font-size: 15px; font-weight: 600; }
  .amt { font-family: var(--font-display); font-size: 17px; font-weight: 600; white-space: nowrap; }
  .amt.income { color: var(--ok-fg); }
  .amt.invest { color: var(--info-fg); }
  .amt.neg { color: var(--pause-fg); }
  .amt-sub { display: block; font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .pills { display: flex; flex-wrap: wrap; gap: 6px; }
  .pill { display: inline-flex; align-items: center; gap: 7px; padding: 3px 11px 3px 9px; border-radius: 99px; font-size: 12.5px; font-weight: 600; white-space: nowrap; }
  .pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
  .p-ok { background: var(--ok-bg); color: var(--ok-fg); }
  .p-warn { background: var(--warn-bg); color: var(--warn-fg); }
  .p-info { background: var(--info-bg); color: var(--info-fg); }
  .p-neutral { background: var(--neutral-bg); color: var(--neutral-fg); }
  .p-bad { background: var(--pause-bg); color: var(--pause-fg); }
  .p-out { background: color-mix(in srgb, var(--c-out) 16%, var(--surface)); color: var(--fg); }
  .p-out::before { background: var(--c-out); }

  .lbl-m { display: none; font-size: 12px; color: var(--muted); margin-right: 6px; }
  .g-tx { grid-template-columns: 74px minmax(0, 2.2fr) minmax(0, 1.4fr) 140px 108px; }
  .g-rec { grid-template-columns: minmax(0, 2fr) minmax(0, 1.4fr) 140px 120px 150px; }
  .g-hold { grid-template-columns: minmax(0, 2fr) 120px 130px 130px 108px; }
  .g-acc { grid-template-columns: minmax(0, 2fr) minmax(0, 1fr) 150px 108px; }
  .g-bud { grid-template-columns: minmax(0, 1.4fr) minmax(0, 2fr) 120px 108px; }

  @media (max-width: 760px) {
    .row.head { display: none; }
    .row { padding: 13px 16px; }
    .g-tx { grid-template-columns: 54px minmax(0, 1fr) auto; grid-template-areas: "date main amt" "date tags actions"; }
    .g-tx .c-date { grid-area: date; align-self: start; }
    .g-tx .c-main { grid-area: main; }
    .g-tx .c-tags { grid-area: tags; }
    .g-tx .r-amt { grid-area: amt; }
    .g-tx .r-actions { grid-area: actions; }
    .g-rec, .g-hold, .g-acc, .g-bud { grid-template-columns: minmax(0, 1fr) auto; }
    .g-rec .c-main, .g-hold .c-main, .g-acc .c-main, .g-bud .c-main { grid-column: 1 / -1; }
    .row .r-num, .row .r-amt { text-align: left; }
    .g-rec .r-actions, .g-hold .r-actions, .g-acc .r-actions, .g-bud .r-actions { grid-column: 1 / -1; justify-content: flex-start; margin-left: -8px; }
    .lbl-m { display: inline; }
  }

  .empty { padding: 40px 24px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
  .empty h2 { margin: 0 0 6px; font-family: var(--font-display); font-size: 21px; font-weight: 600; }
  .empty p { margin: 0 0 18px; color: var(--muted); max-width: 56ch; }
  .banner { padding: 12px 14px; border-radius: 10px; background: var(--warn-bg); color: var(--warn-fg); margin-bottom: 16px; font-size: 14px; }

  /* Dialogs */
  dialog { border: 1px solid var(--line); border-radius: 14px; padding: 0; background: var(--surface); color: var(--fg); box-shadow: var(--shadow); width: min(640px, calc(100vw - 32px)); max-height: calc(100dvh - 32px); }
  dialog.small { width: min(440px, calc(100vw - 32px)); }
  dialog::backdrop { background: rgba(6, 14, 17, .55); }
  dialog[open] { display: flex; flex-direction: column; }
  dialog form { display: flex; flex-direction: column; min-height: 0; flex: 1; }
  .sheet-head { padding: 20px 22px 0; }
  .sheet-head h2 { margin: 0; font-family: var(--font-display); font-size: 22px; font-weight: 600; }
  .sheet-head p { margin: 4px 0 0; color: var(--muted); font-size: 14px; }
  .sheet-body { padding: 18px 22px; overflow: auto; min-height: 0; }
  .sheet-foot { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 10px; padding: 14px 22px 18px; border-top: 1px solid var(--line); }
  .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 16px; }
  .full { grid-column: 1 / -1; }
  .field label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 5px; }
  .field .hint { margin: 5px 0 0; font-size: 12.5px; color: var(--muted); }
  .field.check label { display: flex; align-items: center; gap: 10px; margin: 6px 0 0; font-weight: 500; font-size: 14px; }
  .type-switch { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border: 1px solid var(--line); border-radius: 10px; padding: 3px; gap: 3px; background: var(--surface-2); }
  .type-switch button { font: inherit; font-size: 14px; font-weight: 600; padding: 8px 6px; border: 0; border-radius: 8px; background: none; color: var(--muted); cursor: pointer; }
  .type-switch button[aria-pressed="true"] { background: var(--surface); color: var(--fg); box-shadow: 0 1px 2px rgba(19,34,42,.12); }
  .form-err { margin: 14px 0 0; padding: 10px 12px; border-radius: 8px; background: var(--pause-bg); color: var(--pause-fg); font-size: 14px; }
  @media (max-width: 560px) { .grid { grid-template-columns: minmax(0, 1fr); } .sheet-head, .sheet-body, .sheet-foot { padding-left: 18px; padding-right: 18px; } }

  .toast-host { position: fixed; left: 0; right: 0; bottom: 0; z-index: 50; display: flex; justify-content: center; pointer-events: none; padding: 0 max(16px, env(safe-area-inset-right, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
  #toast { pointer-events: auto; background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 14px; font-weight: 500; box-shadow: var(--shadow); }

  @media (prefers-reduced-motion: reduce) { .track i { transition: none; } }
</style>

<div class="wrap">
  <header class="top">
    <div>
      <p class="eyebrow">Personal &amp; VINIT</p>
      <h1>Finances</h1>
    </div>
    <div class="top-actions">
      <div class="month" role="group" aria-label="Month">
        <button type="button" id="m-prev" aria-label="Previous month">‹</button>
        <span id="m-label" aria-live="polite"></span>
        <button type="button" id="m-next" aria-label="Next month">›</button>
      </div>
      <button type="button" class="btn" id="btn-rates" hidden>Rates</button>
      <button type="button" class="btn primary" id="btn-add" hidden>Add entry</button>
    </div>
  </header>

  <div id="banner" class="banner" hidden></div>

  <section class="overview" aria-label="Overview">
    <div class="nw">
      <span class="k">Net worth</span>
      <div class="v" id="nw-v">0 RON</div>
      <div class="parts" id="nw-parts"></div>
    </div>
    <div class="stats">
      <div class="stat"><span class="k"><i class="sw" style="background:var(--c-in)"></i>Income</span><span class="v" id="s-in">0</span><span class="d" id="d-in"></span></div>
      <div class="stat"><span class="k"><i class="sw" style="background:var(--c-out)"></i>Expenses</span><span class="v" id="s-out">0</span><span class="d" id="d-out"></span></div>
      <div class="stat"><span class="k"><i class="sw" style="background:var(--c-inv)"></i>Invested</span><span class="v" id="s-inv">0</span><span class="d" id="d-inv"></span></div>
      <div class="stat"><span class="k">Left over</span><span class="v" id="s-left">0</span><span class="d" id="d-left"></span></div>
    </div>
  </section>

  <section class="panels">
    <div class="panel">

<script>
(function () {

  };

  var TABS = [
    ["transactions", "Transactions"], ["recurring", "Recurring"], ["holdings", "Investments"], ["accounts", "Accounts"], ["budgets", "Budgets"]
  ];

  /* ---------- state ---------- */
  var $ = function (id) { return document.getElementById(id); };

  function parseNum(v) { var t = String(v == null ? "" : v).trim().replace(/\s/g, "").replace(",", "."); if (t === "") return null; var n = Number(t); return isFinite(n) ? n : NaN; }

    var m = freq === "quarterly" ? 3 : freq === "yearly" ? 12 : 1;
    var day = d.getDate();
    var t = new Date(d.getFullYear(), d.getMonth() + m, 1);

  }
  function daysUntil(iso) { var a = new Date(todayISO() + "T00:00:00"), b = new Date(iso + "T00:00:00"); return Math.round((b - a) / 86400000); }
  function byId(coll, id) { return data[coll].filter(function (x) { return x.id === id; })[0]; }
  function accountOptions() { return [["", "None"]].concat(data.accounts.slice().sort(function (a, b) { return String(a.name).localeCompare(String(b.name), "ro"); }).map(function (a) { return [a.id, a.name || "Untitled account"]; })); }
  function holdingOptions() { return [["", "None"]].concat(data.holdings.map(function (x) { return [x.id, x.name || "Untitled investment"]; })); }
  var toastTimer;
  function toast(msg) { var t = $("toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.hidden = true; }, 3200); }

  /* ---------- derived numbers ---------- */
  function txIn(ym) { return data.transactions.filter(function (t) { return String(t.date || "").slice(0, 7) === ym; }); }
  function sums(list) {
    var r = { income: 0, expense: 0, invest: 0 };
    list.forEach(function (t) { if (r[t.type] != null) r[t.type] += toRON(t.amount, t.currency); });
    return r;
  }
  function holdingInvested(hd) {
    var c = data.transactions.filter(function (t) { return t.type === "invest" && t.holdingId === hd.id; })
      .reduce(function (a, t) { return a + toRON(t.amount, t.currency); }, 0);

  }
  function netWorth() {

    data.accounts.forEach(function (a) { var v = toRON(a.balance, a.currency); if (LIABILITY[a.kind]) debts += Math.abs(v); else assets += v; });
    data.holdings.forEach(function (x) { inv += toRON(x.currentValue, x.currency); });

  }

  /* ---------- rendering: overview ---------- */
  function delta(cur, prev, upGood) {
    if (!prev && !cur) return { t: "", c: "" };

    var p = (cur - prev) / Math.abs(prev) * 100;
    var up = p >= 0;
    return { t: (up ? "▲ " : "▼ ") + Math.abs(Math.round(p)) + "% vs " + monthLabel(shiftMonth(state.month, -1), true), c: up ? (upGood ? "up-good" : "up-bad") : (upGood ? "down-bad" : "down-good") };
  }
  function setDelta(id, d) { var el = $(id); el.textContent = d.t; el.className = "d " + d.c; }
  function renderOverview() {
    $("m-label").textContent = monthLabel(state.month);
    var nw = netWorth();
    $("nw-v").textContent = signed(nw.total);
    var parts = $("nw-parts"); parts.textContent = "";
    parts.append(h("span", { text: "Accounts " + money(nw.assets) }), h("span", { text: "Investments " + money(nw.inv) }));
    if (nw.debts) parts.append(h("span", { text: "Debts −" + money(nw.debts) }));
    var cur = sums(txIn(state.month)), prev = sums(txIn(shiftMonth(state.month, -1)));
    $("s-in").textContent = money(cur.income);
    $("s-out").textContent = money(cur.expense);
    $("s-inv").textContent = money(cur.invest);
    var left = cur.income - cur.expense - cur.invest;
    $("s-left").textContent = signed(left);
    $("s-left").style.color = left < 0 ? "var(--pause-fg)" : "";
    setDelta("d-in", delta(cur.income, prev.income, true));
    setDelta("d-out", delta(cur.expense, prev.expense, false));
    setDelta("d-inv", delta(cur.invest, prev.invest, true));
    var rate = cur.income > 0 ? Math.round((cur.income - cur.expense) / cur.income * 100) : null;
    setDelta("d-left", { t: rate == null ? "" : "Savings rate " + rate + "%", c: rate == null ? "" : rate >= 20 ? "up-good" : rate < 0 ? "up-bad" : "" });
  }

  /* ---------- rendering: cash-flow chart ---------- */
  function niceMax(v) { if (v <= 0) return 1000; var p = Math.pow(10, Math.floor(Math.log10(v))); var m = v / p; return (m <= 1 ? 1 : m <= 2 ? 2 : m <= 2.5 ? 2.5 : m <= 5 ? 5 : 10) * p; }
  function barPath(x, y, w, hgt, r) {
    if (hgt <= 0) return "";
    r = Math.min(r, w / 2, hgt);
    return "M" + x + "," + (y + hgt) + "V" + (y + r) + "Q" + x + "," + y + " " + (x + r) + "," + y + "H" + (x + w - r) + "Q" + (x + w) + "," + y + " " + (x + w) + "," + (y + r) + "V" + (y + hgt) + "Z";
  }
  function renderChart() {
    var host = $("chart"); host.textContent = "";
    var months = []; for (var i = 5; i >= 0; i--) months.push(shiftMonth(state.month, -i));
    var vals = months.map(function (m) { return sums(txIn(m)); });
    var max = niceMax(Math.max.apply(null, vals.map(function (v) { return Math.max(v.income, v.expense, v.invest); })));
    var W = 600, H = 230, L = 56, R = 8, T = 10, B = 28;
    var pw = W - L - R, ph = H - T - B, gw = pw / 6;
    var svg = s("svg", { viewBox: "0 0 " + W + " " + H, role: "img", "aria-label": "Income, expenses and investments per month for the last six months" });
    for (var g = 0; g <= 4; g++) {
      var y = T + ph - ph * g / 4;
      svg.append(s("line", { x1: L, x2: W - R, y1: y, y2: y, class: "grid" + (g === 0 ? " base" : "") }));
      var t = s("text", { x: L - 8, y: y + 4, "text-anchor": "end", class: "axis" }); t.textContent = g === 0 ? "0" : compact(max * g / 4); svg.append(t);
    }
    var colors = ["var(--c-in)", "var(--c-out)", "var(--c-inv)"], keys = ["income", "expense", "invest"];
    var bw = Math.min(18, (gw - 22) / 3);
    var tip = h("div", { class: "tip", hidden: true });
    months.forEach(function (m, mi) {
      var gx = L + gw * mi, start = gx + (gw - (bw * 3 + 4)) / 2;

      svg.append(hit);
      keys.forEach(function (k, ki) {
        var v = vals[mi][k], bh = Math.max(0, ph * v / max);

        if (p) svg.append(s("path", { d: p, fill: colors[ki], "pointer-events": "none" }));
      });
      var lbl = s("text", { x: gx + gw / 2, y: H - 8, "text-anchor": "middle", class: "axis" + (m === state.month ? " sel" : "") });

          h("div", { class: "tr" }, h("span", null, h("i", { class: "sw", style: "background:var(--c-out)" }), "Expenses"), h("span", { text: money(v.expense) })),
          h("div", { class: "tr" }, h("span", null, h("i", { class: "sw", style: "background:var(--c-inv)" }), "Invested"), h("span", { text: money(v.invest) })),
          h("div", { class: "tr" }, h("span", { text: "Left over" }), h("span", { text: signed(v.income - v.expense - v.invest) })));

  function compact(n) { return n >= 1e6 ? nf2.format(n / 1e6) + "M" : n >= 1000 ? nf2.format(n / 1000) + "k" : nf0.format(n); }

  /* ---------- rendering: categories ---------- */
  function renderCats() {
    var host = $("cats-host"); host.textContent = "";
    $("cat-month").textContent = monthLabel(state.month);
    var spent = {};
    txIn(state.month).forEach(function (t) { if (t.type === "expense") { var c = t.category || "Other"; spent[c] = (spent[c] || 0) + toRON(t.amount, t.currency); } });

    var names = Object.keys(spent); Object.keys(budgets).forEach(function (c) { if (names.indexOf(c) === -1) names.push(c); });
    if (!names.length) { host.append(h("p", { class: "quiet", text: "No expenses logged for this month yet. Add an expense or set a budget to see where the money goes." })); return; }

        }
        if (f.type !== "check") wrap.append(input);
        if (f.hint) wrap.append(h("p", { class: "hint", text: f.hint }));
      }
      F.els[f.k] = input;
      grid.append(wrap);
    });
  }
  function collect() {
    var F = state.form;
    SCHEMAS[F.coll].fields.forEach(function (f) {
      var el = F.els[f.k]; if (!el || f.type === "switch") return;
      F.vals[f.k] = f.type === "check" ? el.checked : el.value;
    });
  }
  function setSaving(on) { state.busy = on; $("form-save").disabled = on; if (on) $("form-save").textContent = "Saving"; }
  function errText(e) {
    var code = e && e.code;
    if (code === "quota_exceeded") return "Storage is full. Delete some old entries and try again.";
    if (code === "invalid_argument") return "This change was refused. Only the ledger's owner can edit it.";
    if (code === "revoked") return "Your access to this page changed. Reload the page.";
    return "That didn't save. Check your connection and try again.";
  }
  function formError(msg, k) { $("form-err").textContent = msg; $("form-err").hidden = false; if (k && state.form.els[k]) state.form.els[k].focus(); }
  async function saveForm(ev) {
    ev.preventDefault();
    if (!db || state.busy || !state.form) return;
    collect();
    var F = state.form, sc = SCHEMAS[F.coll], out = {};
    for (var i = 0; i < sc.fields.length; i++) {
      var f = sc.fields[i], v = F.vals[f.k];
      if (f.show && !f.show(F.vals)) { out[f.k] = ""; continue; }
      if (f.type === "money") {
        var n = parseNum(v);
        if (n === null) { if (f.req) return formError(f.label + " is required.", f.k); n = 0; }
        if (isNaN(n)) return formError(f.label + " must be a number, like 1250 or 49,99.", f.k);
        if (n < 0 && !f.allowNeg) return formError(f.label + " can't be negative. Pick the type instead: Expense for money out.", f.k);
        if (f.req && n === 0 && f.k === "amount") return formError("Amount must be more than 0.", f.k);
        out[f.k] = Math.round(n * 100) / 100;
      } else if (f.type === "check") out[f.k] = !!v;
      else { v = String(v == null ? "" : v).trim(); if (f.req && !v) return formError(f.label + " is required.", f.k); out[f.k] = v; }
    }
    var now = new Date().toISOString(); out.updatedAt = now;
    setSaving(true);
    try {
      var nameOf = out.description || out.name || out.category || sc.noun;
      if (F.id) {
        var old = Object.assign({}, byId(F.coll, F.id) || {}); delete old.id;
        await db.doc(F.coll + "/" + F.id).set(Object.assign(old, out));
        toast("Saved " + nameOf);
      } else {
        out.createdAt = now;
        await db.collection(F.coll).add(out);
        toast("Added " + nameOf);
      }
      $("form-dialog").close(); state.form = null; setSaving(false);
    } catch (e) {
      setSaving(false); $("form-save").textContent = F.id ? "Save changes" : "Add " + sc.noun;
      formError(errText(e));
    }
  }

  /* ---------- recurring → transaction ---------- */
  async function logRecurring(r) {
    if (!db || state.busy) return;
    state.busy = true;
    var now = new Date().toISOString();
    try {
      await db.collection("transactions").add({
        type: r.type || "expense", date: r.nextDate || todayISO(), description: r.name || "Recurring payment",
        amount: Number(r.amount) || 0, currency: r.currency || "RON", category: r.category || "", scope: r.scope || "personal",
        accountId: r.accountId || "", holdingId: "", reference: "", notes: "Logged from recurring", recurringId: r.id, createdAt: now, updatedAt: now
      });
      var next = addPeriod(r.nextDate || todayISO(), r.frequency);
      var rest = Object.assign({}, r); delete rest.id; rest.nextDate = next; rest.updatedAt = now;
      await db.doc("recurring/" + r.id).set(rest);
      toast("Logged " + (r.name || "payment") + ". Next due " + fmtDate(next));
    } catch (e) { toast(errText(e)); }
    state.busy = false;
  }

  /* ---------- delete ---------- */
  function openDelete(coll, id) {
    var rec = byId(coll, id); if (!rec) return;
    var sc = SCHEMAS[coll], nm = rec.description || rec.name || rec.category || "This " + sc.noun;
    state.del = { coll: coll, id: id, name: nm };
    $("del-title").textContent = "Delete " + sc.noun + "?";
    var extra = "";
    if (coll === "accounts") extra = " Transactions that used it stay, without an account.";
    if (coll === "holdings") extra = " Linked Invest entries stay in your transactions.";
    $("del-text").textContent = "“" + nm + "” will be removed for good." + extra;
    $("del-err").hidden = true; $("del-confirm").disabled = false;
    $("del-dialog").showModal();
  }
  async function confirmDelete(ev) {
    ev.preventDefault();
    if (!db || !state.del) return;
    var d = state.del; $("del-confirm").disabled = true;
    try {
      await db.doc(d.coll + "/" + d.id).delete();
      $("del-dialog").close(); state.del = null; toast("Deleted " + d.name);
    } catch (e) { $("del-confirm").disabled = false; $("del-err").textContent = errText(e); $("del-err").hidden = false; }
  }

  /* ---------- rates ---------- */
  function openRates() { $("r-eur").value = String(rates.eur); $("r-usd").value = String(rates.usd); $("rates-err").hidden = true; $("rates-dialog").showModal(); }
  async function saveRates(ev) {
    ev.preventDefault();
    var e = parseNum($("r-eur").value), u = parseNum($("r-usd").value);
    if (!(e > 0) || !(u > 0)) { $("rates-err").textContent = "Enter both rates as positive numbers, like 5,09."; $("rates-err").hidden = false; return; }
    $("rates-save").disabled = true;
    try { await db.doc("settings/main").set({ eur: e, usd: u, updatedAt: new Date().toISOString() }); $("rates-dialog").close(); toast("Rates saved"); }
    catch (err) { $("rates-err").textContent = errText(err); $("rates-err").hidden = false; }
    $("rates-save").disabled = false;
  }

  /* ---------- export ---------- */
  async function exportCsv() {
    if (!downloads) return;
    var rows = visibleTx();
    var esc = function (v) { v = String(v == null ? "" : v); return /[",\n;]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
    var lines = [["Date", "Type", "Description", "Category", "Scope", "Account", "Amount", "Currency", "Amount RON", "Reference", "Notes"].join(",")];
    rows.forEach(function (t) {
      var acc = t.accountId ? byId("accounts", t.accountId) : null;
      lines.push([t.date, label(TYPES, t.type), t.description, t.category, label(SCOPES, t.scope), acc ? acc.name : "", t.amount, t.currency || "RON", toRON(t.amount, t.currency).toFixed(2), t.reference, t.notes].map(esc).join(","));
    });
    var name = "finances-" + (state.txPeriod === "month" ? state.month : "all") + ".csv";
    try { await downloads.save({ filename: name, data: new Blob(["﻿" + lines.join("\n")], { type: "text/csv" }) }); }
    catch (e) { if (!e || e.code !== "declined") toast("The export didn't download. Try again."); }
  }

  /* ---------- wiring ---------- */
  $("m-prev").addEventListener("click", function () { state.month = shiftMonth(state.month, -1); renderAll(); });
  $("m-next").addEventListener("click", function () { state.month = shiftMonth(state.month, 1); renderAll(); });
  $("btn-add").addEventListener("click", function () { openForm(state.tab === "transactions" ? "transactions" : state.tab, null); });
  $("btn-rates").addEventListener("click", openRates);
  $("entry-form").addEventListener("submit", saveForm);
  $("form-cancel").addEventListener("click", function () { $("form-dialog").close(); });
  $("del-form").addEventListener("submit", confirmDelete);
  $("del-cancel").addEventListener("click", function () { $("del-dialog").close(); });
  $("rates-form").addEventListener("submit", saveRates);
  $("rates-cancel").addEventListener("click", function () { $("rates-dialog").close(); });
  window.addEventListener("resize", function () { var t = document.querySelector(".tip"); if (t) t.hidden = true; });
  renderAll();

  async function init() {
    var c = window.claude;
    if (!c || !c.use) { state.unavailable = true; renderAll(); return; }
    try {
      var user = await c.use("user");
      if (user) {
        var own = typeof user.isOwner === "function" ? await user.isOwner() : null;
        if (own === false) { state.privateView = true; state.canWrite = false; renderAll(); return; }
      }
    } catch (e) {}
    try { db = await c.use("db"); } catch (e) { db = null; }
    if (!db) { state.unavailable = true; renderAll(); return; }
    try { downloads = await c.use("downloads"); } catch (e) { downloads = null; }
    var colls = Object.keys(data), pending = colls.length + 1;
    var timer = setTimeout(function () { if (!state.loaded) { state.slow = true; renderBanner(); } }, 10000);
    function arrived() { if (pending > 0) pending--; if (pending === 0 && !state.loaded) { state.loaded = true; state.slow = false; clearTimeout(timer); } }
    function fail() { clearTimeout(timer); state.failed = true; state.loaded = false; renderAll(); }
    colls.forEach(function (k) {
      var first = true;
      db.collection(k).onSnapshot(function (snap) {
        data[k] = snap.docs.map(function (d) { return Object.assign({ id: d.id }, d.data()); });
        if (first && (!snap.metadata.fromCache || snap.size > 0)) { first = false; arrived(); }
        renderAll();
      }, fail);
    });
    var firstS = true;
    db.doc("settings/main").onSnapshot(function (snap) {
      var d = snap.exists ? snap.data() : null;
      rates = { eur: (d && d.eur > 0) ? d.eur : DEFAULT_RATES.eur, usd: (d && d.usd > 0) ? d.usd : DEFAULT_RATES.usd };
      if (firstS) { firstS = false; arrived(); }
      renderAll();
    }, fail);
  }
  init();
})();
</script>

</body></html>
