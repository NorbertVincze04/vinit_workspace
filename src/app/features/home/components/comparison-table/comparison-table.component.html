<div class="scroll">
  <table>
    @if (caption()) {
      <caption class="sr-only">{{ caption() }}</caption>
    }
    <thead>
      <tr>
        <th scope="col"><span class="sr-only">Feature</span></th>
        @for (column of table().columns; track column; let first = $first) {
          <th scope="col" [class.us]="first">{{ column }}</th>
        }
      </tr>
    </thead>
    <tbody>
      @for (row of table().rows; track row.trait) {
        <tr>
          <th scope="row">{{ row.trait }}</th>
          @for (value of row.values; track $index; let first = $first) {
            <td [class.us]="first">
              <span class="mark" [class.yes]="value" [class.no]="!value">
                <app-icon [name]="value ? 'check' : 'close'" [size]="16" [stroke]="2.6" />
              </span>
              <span class="sr-only">{{ value ? 'Yes' : 'No' }}</span>
            </td>
          }
        </tr>
      }
    </tbody>
  </table>
</div>
