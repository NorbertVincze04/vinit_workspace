<app-page-header title="Salons" description="Every salon on the platform, from first signature to live site. Open one to see its whole story.">
  <div pageActions>
    <button appButton variant="primary" type="button" (click)="openNew()">
      <app-icon name="plus" [size]="16" /> {{ 'New salon' | t }}
    </button>
  </div>
</app-page-header>

<app-legacy-clients-banner />

@if (store.salons().length) {
  <div class="toolbar">
    <app-text-field
      class="grow"
      type="search"
      label="Search salons"
      labelMode="hidden"
      placeholder="Search salon, client, city, domain"
      [value]="store.filters().q"
      (valueChange)="store.setFilters({ q: $event })"
    />
    <app-chip-group
      label="Filter by status"
      [options]="store.statusChips()"
      [value]="store.filters().status"
      (valueChange)="store.setFilters({ status: $event })"
    />
  </div>
  <app-inline-stats class="summary" [items]="summary()" />
}

@if (!store.loaded()) {
  <app-empty-state heading="Loading salons…" text="Reading the list from the VINIT server." />
} @else if (!store.salons().length) {
  <app-empty-state
    heading="No salons yet"
    text="Add a salon with its billing details (who pays), plan and domain. Leads you win will also land here."
  >
    <button appButton variant="primary" type="button" (click)="openNew()">{{ 'Add salon' | t }}</button>
  </app-empty-state>
} @else if (!store.visible().length) {
  <app-empty-state heading="No salons match" text="Try a different search or status filter.">
    <button appButton type="button" (click)="store.clearFilters()">{{ 'Clear filters' | t }}</button>
  </app-empty-state>
} @else {
  <app-ledger
    [headers]="['Salon', 'Billed to', 'Plan', 'Status']"
    columns="minmax(0, 1.8fr) minmax(0, 1.5fr) minmax(0, 1.2fr) 120px"
  >
    @for (salon of store.visible(); track salon.id) {
      <app-salon-row [salon]="salon" (open)="open(salon)" />
    }
  </app-ledger>
}

@if (form(); as fields) {
  <app-form-dialog
    heading="New salon"
    subheading="The salon and the client who pays for it."
    [fields]="fields"
    saveLabel="Add salon"
    (saved)="save($event)"
    (closed)="form.set(null)"
  />
}
