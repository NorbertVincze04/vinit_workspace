<div class="container">
  <app-page-header
    eyebrow="VINIT SaaS Solutions"
    title="Appendices"
    lede="Supporting files for the business plan: PDFs, presentations, spreadsheets and documents. Upload them once, download them whenever you need them."
  />

  <app-upload-zone
    [busy]="store.uploading() > 0"
    [hint]="'PDF, PowerPoint, Excel, Word, images and more · up to ' + maxSize + ' each'"
    (files)="upload($event)"
  />

  @if (store.appendices().length) {
    <div class="toolbar">
      <app-text-field
        class="grow"
        type="search"
        label="Search files"
        labelMode="hidden"
        placeholder="Search file name or type"
        [value]="store.filters().q"
        (valueChange)="store.setFilters({ q: $event })"
      />
      <app-chip-group
        label="Filter by file type"
        [options]="store.kindChips()"
        [value]="store.filters().kind"
        (valueChange)="setKind($event)"
      />
    </div>
    <app-inline-stats class="summary" [items]="summary()" />
  }

  @if (!store.appendices().length) {
    <app-empty-state
      heading="No appendices yet"
      text="Add the files that support the plan, such as the financial model, the pitch deck or signed agreements. Each file can be downloaded or deleted from this list."
    />
  } @else if (!store.visible().length) {
    <app-empty-state heading="No files match" text="Try a different search or file type.">
      <button appButton type="button" (click)="store.clearFilters()">Clear filters</button>
    </app-empty-state>
  } @else {
    <app-ledger [headers]="['File', 'Size', 'Added', '']" [numeric]="[1]" columns="minmax(0, 1fr) 90px 120px auto">
      @for (appendix of store.visible(); track appendix.id) {
        <app-appendix-row
          [appendix]="appendix"
          [busy]="downloadingId() === appendix.id"
          (download)="download(appendix)"
          (remove)="deleting.set(appendix)"
        />
      }
    </app-ledger>
  }

  <app-save-status
    message="Files are saved in this browser. Anyone using this browser can download them."
    failedMessage="Could not save the file list in this browser. Download your files to keep a copy."
  />
</div>

@if (deleting(); as appendix) {
  <app-confirm-dialog
    heading="Delete file?"
    [message]="'“' + appendix.name + '” will be removed from the appendices. This can’t be undone.'"
    cancelLabel="Keep file"
    (confirmed)="confirmDelete(appendix)"
    (closed)="deleting.set(null)"
  />
}
