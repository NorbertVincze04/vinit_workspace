<app-page-header title="Roadmap" description="Year 1 phases, step by step, and paying salons against break-even.">
  <div pageActions>
    <app-backup-menu [store]="store" name="roadmap" />
  </div>
  <app-progress-summary
    [label]="store.overall().done + ' of ' + store.overall().total + ' steps done'"
    [percent]="store.overall().percent"
  />
</app-page-header>

<div class="phases">
  @for (view of store.phases(); track view.phase.id) {
    <app-phase-card [phase]="view.phase" [done]="view.done" [total]="view.total" unit="steps" [current]="view.current">
      <ul class="steps">
        @for (step of view.steps; track step.id) {
          <li>
            <app-checkbox variant="row" strike [checked]="step.done" (checkedChange)="store.setStep(step.id, $event)">
              {{ step.text }}
            </app-checkbox>
          </li>
        }
      </ul>
      <p class="milestone"><span>Done when</span> {{ view.milestone }}</p>
    </app-phase-card>
  }
</div>

<app-salon-counter class="page-section" [count]="store.salons()" (countChange)="store.setSalons($event)" />

<div class="extras page-section">
  <app-weekly-rhythm />
  <app-panel [heading]="planB.title">
    <p>{{ planB.text }}</p>
    <p class="muted small">{{ planB.note }}</p>
  </app-panel>
</div>
