<app-page-header title="Finances" description="Business and personal money. EUR and USD are converted to RON.">
  <div pageActions>
    <app-month-switcher [value]="store.month()" (valueChange)="store.month.set($event)" />
    <app-backup-menu [store]="store" name="finances">
      <button appMenuItem type="button" (click)="ratesOpen.set(true)">
        <app-icon name="coins" [size]="16" /> Exchange rates…
      </button>
    </app-backup-menu>
    <button appButton variant="primary" type="button" (click)="openForm(store.tab())">
      <app-icon name="plus" [size]="16" /> Add {{ meta(store.tab()).noun }}
    </button>
  </div>
</app-page-header>

<app-finance-overview
  [netWorth]="store.netWorth()"
  [totals]="store.monthTotals()"
  [previous]="store.prevTotals()"
  [previousLabel]="previousLabel()"
/>

<div class="panels">
  <app-panel heading="Cash flow" meta="Last 6 months">
    <app-bar-chart
      ariaLabel="Income, expenses and investments per month for the last six months"
      [series]="series"
      [groups]="store.chartGroups()"
      (groupSelect)="store.month.set($event)"
    />
  </app-panel>
  <app-panel heading="Spending by category" [meta]="monthLabel()">
    <app-category-spending [rows]="store.categorySpend().rows" [hidden]="store.categorySpend().hidden" />
  </app-panel>
</div>

<app-tabs label="Ledger sections" [options]="store.tabOptions()" [value]="store.tab()" (valueChange)="setTab($event)" />
<div class="tab-panel" role="tabpanel">
  @switch (store.tab()) {
    @case ('transactions') {
      <app-transactions-panel
        (add)="openForm('transactions')"
        (edit)="openForm('transactions', $event)"
        (remove)="askDelete('transactions', $event)"
        (exportCsv)="exportCsv()"
      />
    }
    @case ('recurring') {
      <app-recurring-panel
        (add)="openForm('recurring')"
        (edit)="openForm('recurring', $event)"
        (remove)="askDelete('recurring', $event)"
        (log)="logRecurring($event)"
      />
    }
    @case ('holdings') {
      <app-holdings-panel
        (add)="openForm('holdings')"
        (edit)="openForm('holdings', $event)"
        (remove)="askDelete('holdings', $event)"
      />
    }
    @case ('accounts') {
      <app-accounts-panel
        (add)="openForm('accounts')"
        (edit)="openForm('accounts', $event)"
        (remove)="askDelete('accounts', $event)"
      />
    }
    @case ('budgets') {
      <app-budgets-panel
        (add)="openForm('budgets')"
        (edit)="openForm('budgets', $event)"
        (remove)="askDelete('budgets', $event)"
      />
    }
  }
</div>

@if (form(); as f) {
  <app-form-dialog
    [heading]="formHeading()"
    [subheading]="meta(f.collection).sub"
    [fields]="fields[f.collection]"
    [initial]="f.values"
    [saveLabel]="f.id ? 'Save changes' : 'Add ' + meta(f.collection).noun"
    (saved)="save($event)"
    (closed)="form.set(null)"
  />
}

@if (ratesOpen()) {
  <app-form-dialog
    size="sm"
    heading="Exchange rates"
    subheading="Used to convert EUR and USD entries into RON for every total."
    [fields]="rateFields"
    [initial]="{ eur: store.rates().eur, usd: store.rates().usd }"
    saveLabel="Save rates"
    (saved)="saveRates($event)"
    (closed)="ratesOpen.set(false)"
  />
}

@if (deleting(); as d) {
  <app-confirm-dialog
    [heading]="'Delete ' + meta(d.collection).noun + '?'"
    [message]="deleteMessage(d)"
    (confirmed)="confirmDelete(d)"
    (closed)="deleting.set(null)"
  />
}
