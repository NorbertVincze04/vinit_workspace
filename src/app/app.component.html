@if (auth.user()) {
  <a class="skip-link" href="#main" (click)="skipToContent($event, main)">{{ 'Skip to content' | t }}</a>

  <header class="topbar">
    <button
      appButton
      variant="ghost"
      iconOnly
      type="button"
      aria-controls="sidebar"
      [attr.aria-expanded]="navOpen()"
      [attr.aria-label]="(navOpen() ? 'Close navigation' : 'Open navigation') | t"
      (click)="toggleNav()"
    >
      <app-icon [name]="navOpen() ? 'close' : 'menu'" />
    </button>
    <a class="topbar-brand" routerLink="/" [attr.aria-label]="'VINIT Workspace, overview' | t">
      <app-logo [size]="22" />
      <span>{{ 'VINIT' | t }}</span>
    </a>
    <button appButton variant="ghost" iconOnly type="button" class="topbar-search" [attr.aria-label]="'Search' | t" (click)="search.open.set(true)">
      <app-icon name="search" />
    </button>
    <app-bell />
  </header>

  <app-sidebar id="sidebar" class="sidebar" [class.is-open]="navOpen()" (navigate)="closeNav()" />
  @if (navOpen()) {
    <div class="backdrop" aria-hidden="true" (click)="closeNav()"></div>
  }

  <main id="main" #main tabindex="-1">
    <div class="content">
      <router-outlet />
    </div>
  </main>
} @else {
  <!-- Sign-in page (or the moment before the session check finishes): no workspace chrome. -->
  <router-outlet />
}

@if (auth.user()) {
  <app-search-palette />
}
<app-toast />
