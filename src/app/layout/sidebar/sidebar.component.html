<div class="brand-row">
  <a class="brand" routerLink="/" aria-label="VINIT Workspace, overview" (click)="navigate.emit()">
    <app-logo [size]="24" />
    <span class="brand-name">VINIT <span class="brand-sub">Workspace</span></span>
  </a>
  <app-bell class="desktop-bell" />
</div>
<button type="button" class="search-btn" (click)="openSearch()">
  <app-icon name="search" [size]="16" />
  <span>Search</span>
  <kbd>Ctrl K</kbd>
</button>

<nav class="nav" aria-label="Workspace">
  <a
    class="link"
    [routerLink]="overview.route"
    routerLinkActive="is-active"
    ariaCurrentWhenActive="page"
    [routerLinkActiveOptions]="{ exact: true }"
    (click)="navigate.emit()"
  >
    <app-icon [name]="overview.icon" [size]="18" />
    {{ overview.label }}
  </a>
  <a class="link" [routerLink]="activity.route" routerLinkActive="is-active" ariaCurrentWhenActive="page" (click)="navigate.emit()">
    <app-icon [name]="activity.icon" [size]="18" />
    {{ activity.label }}
  </a>

  @for (group of groups; track group.id) {
    <p class="group" [id]="'nav-' + group.id">{{ group.title }}</p>
    <ul [attr.aria-labelledby]="'nav-' + group.id">
      @for (link of group.links; track link.route) {
        <li>
          <a
            class="link"
            [routerLink]="link.route"
            routerLinkActive="is-active"
            ariaCurrentWhenActive="page"
            (click)="navigate.emit()"
          >
            <app-icon [name]="link.icon" [size]="18" />
            {{ link.label }}
          </a>
        </li>
      }
    </ul>
  }
</nav>

<div class="foot">
  <p class="save" [class.failed]="save().failed" [title]="save().detail" role="status">
    <span class="dot" aria-hidden="true"></span>
    {{ save().text }}
  </p>
  <button
    type="button"
    class="link"
    [attr.aria-label]="theme.effective() === 'dark' ? 'Switch to light theme' : 'Switch to dark theme'"
    (click)="theme.toggle()"
  >
    <app-icon [name]="theme.effective() === 'dark' ? 'sun' : 'moon'" [size]="18" />
    {{ theme.effective() === 'dark' ? 'Light mode' : 'Dark mode' }}
  </button>
  @if (auth.user(); as user) {
    <button type="button" class="link" [attr.aria-label]="'Sign out ' + user.fullName" (click)="auth.logout()">
      <app-icon name="log-out" [size]="18" />
      <span class="who">Sign out <span class="muted">· {{ user.fullName }}</span></span>
    </button>
  }
</div>
