<div class="container bar">
  <a class="brand" routerLink="/" aria-label="VINIT workspace — overview" (click)="closeMenu()">
    <app-logo [size]="28" wordmark />
    <span class="brand-tag eyebrow">Workspace</span>
  </a>

  <nav id="main-nav" class="nav" [class.is-open]="menuOpen()" aria-label="Main">
    @for (link of links; track link.route) {
      <a
        class="nav-link"
        [routerLink]="link.route"
        routerLinkActive="is-active"
        ariaCurrentWhenActive="page"
        [routerLinkActiveOptions]="{ exact: link.exact }"
        (click)="closeMenu()"
      >
        <app-icon [name]="link.icon" [size]="18" />
        {{ link.label }}
      </a>
    }
  </nav>

  <div class="actions">
    <button
      appButton
      variant="ghost"
      iconOnly
      type="button"
      [attr.aria-label]="theme.effective() === 'dark' ? 'Switch to light theme' : 'Switch to dark theme'"
      (click)="theme.toggle()"
    >
      <app-icon [name]="theme.effective() === 'dark' ? 'sun' : 'moon'" />
    </button>
    <button
      appButton
      variant="ghost"
      iconOnly
      type="button"
      class="menu-toggle"
      aria-controls="main-nav"
      [attr.aria-expanded]="menuOpen()"
      [attr.aria-label]="menuOpen() ? 'Close menu' : 'Open menu'"
      (click)="toggleMenu()"
    >
      <app-icon [name]="menuOpen() ? 'close' : 'menu'" />
    </button>
  </div>
</div>
