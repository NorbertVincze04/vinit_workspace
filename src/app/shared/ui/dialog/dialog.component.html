<dialog #dialog [attr.aria-labelledby]="titleId" [attr.data-size]="size()" (close)="closed.emit()"
  (cancel)="onCancel($event)"
  (pointerdown)="onPointerDown($event)"
  (click)="onClick($event)"
>
  <div class="head">
    <h2 [id]="titleId">{{ heading() | t }}</h2>
    @if (subheading()) {
      <p>{{ subheading() | t }}</p>
    }
  </div>
  <div class="body">
    <ng-content />
  </div>
  <div class="foot">
    <ng-content select="[dialogFooter]" />
  </div>
</dialog>
