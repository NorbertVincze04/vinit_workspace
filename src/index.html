<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>VINIT Workspace</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="VINIT SaaS Solutions — internal workspace: business overview, Year 1 roadmap and task worksheet.">
  <meta name="theme-color" content="#0e9899">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="alternate icon" type="image/x-icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@500&family=Public+Sans:wght@400;500;600;700&display=swap">
  <!-- Apply the saved theme before Angular boots, so there is no light/dark flash. -->
  <script>
    try {
      var t = JSON.parse(localStorage.getItem('vinit.theme'));
      if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
