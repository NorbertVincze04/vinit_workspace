# VINIT Workspace on your own PC.
#   docker compose up -d --build   → start everything (open http://localhost:8080, or http://<pc-ip>:8080 from a phone)
#   docker compose stop            → stop it (data is kept in the "pgdata" volume)
#   docker compose up -d db        → only the database (for `npm start` + `npm run dev` while developing)
# Secrets come from ./.env (copy .env.example). Nothing here talks to a paid cloud service.
name: vinit

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vinit
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      POSTGRES_DB: vinit
    # Only reachable from this PC (not from the network).
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vinit -d vinit"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: ./api
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: vinit
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: vinit
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      # Plain http on the home network; set to "true" only behind HTTPS.
      COOKIE_SECURE: "false"
      # nginx (the web service) is the one proxy in front of the API.
      TRUST_PROXY: "1"
      # Integrations (optional, from .env; empty = not configured).
      INVOICE_PROVIDER: ${INVOICE_PROVIDER:-}
      SMARTBILL_EMAIL: ${SMARTBILL_EMAIL:-}
      SMARTBILL_TOKEN: ${SMARTBILL_TOKEN:-}
      SMARTBILL_CIF: ${SMARTBILL_CIF:-}
      SMARTBILL_SERIES: ${SMARTBILL_SERIES:-}
      OBLIO_EMAIL: ${OBLIO_EMAIL:-}
      OBLIO_SECRET: ${OBLIO_SECRET:-}
      OBLIO_CIF: ${OBLIO_CIF:-}
      OBLIO_SERIES: ${OBLIO_SERIES:-}
      UPTIMEROBOT_API_KEY: ${UPTIMEROBOT_API_KEY:-}
      TENANT_PLATFORM_URL: ${TENANT_PLATFORM_URL:-}
      TENANT_PLATFORM_TOKEN: ${TENANT_PLATFORM_TOKEN:-}
    depends_on:
      db:
        condition: service_healthy

  web:
    build: .
    # Reachable from this PC (http://localhost:8080) and from phones on the same Wi-Fi (http://<pc-ip>:8080).
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  pgdata:
