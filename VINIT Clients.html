<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>VINIT Clients</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
  /* Layout: one ruled client ledger under a header and toolbar; create/edit/delete happen in modal sheets. */
  :root {
    --bg: #F3F7F7;
    --surface: #FFFFFF;
    --surface-2: #EAF1F1;
    --fg: #13222A;
    --muted: #566A72;
    --line: #D5E1E2;
    --accent: #0E9899;          /* brand green, decorative fills */
    --accent-strong: #087374;   /* brand green, buttons and text */
    --accent-ink: #FFFFFF;
    --accent-2: #35398C;        /* brand blue */
    --focus: #35398C;
    --ok-bg: #DDF3EA;   --ok-fg: #0B6B47;
    --warn-bg: #FBEFD2; --warn-fg: #7A5200;
    --info-bg: #E4E5F6; --info-fg: #35398C;
    --neutral-bg: #E8EDEE; --neutral-fg: #44565D;
    --pause-bg: #F1E3E3; --pause-fg: #8A3A3A;
    --danger: #B3261E;
    --danger-ink: #FFFFFF;
    --shadow: 0 1px 2px rgba(19,34,42,.06), 0 12px 32px rgba(19,34,42,.10);
    --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
    --font-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0B1416; --surface: #111D20; --surface-2: #172528; --fg: #E4EEF0; --muted: #8EA5AB; --line: #233639;
      --accent: #2CC4C5; --accent-strong: #2CC4C5; --accent-ink: #04201F; --accent-2: #9DA1F0; --focus: #9DA1F0;
      --ok-bg: #12362B;   --ok-fg: #6FD6A5;
      --warn-bg: #3A2D0F; --warn-fg: #EBC25E;
      --info-bg: #1F2250; --info-fg: #B3B6F5;
      --neutral-bg: #1C2B2E; --neutral-fg: #A9BCC1;
      --pause-bg: #3A2020; --pause-fg: #F0A8A8;
      --danger: #F08A84; --danger-ink: #2A0B0A;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 12px 32px rgba(0,0,0,.45);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0B1416; --surface: #111D20; --surface-2: #172528; --fg: #E4EEF0; --muted: #8EA5AB; --line: #233639;
    --accent: #2CC4C5; --accent-strong: #2CC4C5; --accent-ink: #04201F; --accent-2: #9DA1F0; --focus: #9DA1F0;
    --ok-bg: #12362B;   --ok-fg: #6FD6A5;
    --warn-bg: #3A2D0F; --warn-fg: #EBC25E;
    --info-bg: #1F2250; --info-fg: #B3B6F5;
    --neutral-bg: #1C2B2E; --neutral-fg: #A9BCC1;
    --pause-bg: #3A2020; --pause-fg: #F0A8A8;
    --danger: #F08A84; --danger-ink: #2A0B0A;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 12px 32px rgba(0,0,0,.45);
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font-body);
    font-size: 15px;
    line-height: 1.5;
    padding-block: 30px 64px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .wrap { max-width: 1040px; margin: 0 auto; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

  /* Header */
  .top { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 22px; }
  .eyebrow { margin: 0 0 4px; font-size: 12px; font-weight: 600; letter-spacing: .09em; text-transform: uppercase; color: var(--accent-strong); }
  h1 { margin: 0; font-family: var(--font-display); font-size: clamp(30px, 5vw, 40px); line-height: 1.08; font-weight: 700; letter-spacing: -.015em; text-wrap: balance; }

  /* Overview */
  .overview { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 14px 40px; padding: 18px 0 22px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); margin-bottom: 20px; }
  .stat { display: flex; flex-direction: column; gap: 2px; }
  .stat .k, .be-top { font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .stat .v { font-family: var(--font-display); font-size: 28px; line-height: 1.15; font-weight: 600; font-variant-numeric: tabular-nums; }
  .be { flex: 1 1 260px; min-width: 0; display: flex; flex-direction: column; gap: 9px; }
  .be-top { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .be-top span:last-child { letter-spacing: 0; text-transform: none; font-variant-numeric: tabular-nums; font-weight: 500; }
  .bar { height: 8px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; background: var(--accent); border-radius: inherit; transition: width .4s ease; }

  /* Toolbar */
  .toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-bottom: 14px; }
  .search { flex: 1 1 240px; min-width: 0; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { font: inherit; font-size: 13px; font-weight: 500; padding: 6px 12px; border-radius: 99px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); cursor: pointer; }
  .chip:hover { background: var(--surface-2); }
  .chip[aria-pressed="true"] { background: var(--accent-strong); border-color: var(--accent-strong); color: var(--accent-ink); }
  .chip .n { font-variant-numeric: tabular-nums; opacity: .75; margin-left: 4px; }
  .sort { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
  .sort select { width: auto; padding: 6px 10px; font-size: 13px; }

  /* Inputs */
  input, select, textarea {
    font: inherit; color: var(--fg); background: var(--surface);
    border: 1px solid var(--line); border-radius: 8px; padding: 9px 11px; width: 100%; min-width: 0;
  }
  input::placeholder, textarea::placeholder { color: var(--muted); opacity: .8; }
  input:focus, select:focus, textarea:focus { border-color: var(--accent); }
  textarea { resize: vertical; min-height: 84px; }

  /* Buttons */
  .btn { font: inherit; font-size: 14px; font-weight: 600; padding: 9px 16px; border-radius: 9px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); cursor: pointer; }
  .btn:hover { background: var(--surface-2); }
  .btn.primary { background: var(--accent-strong); border-color: var(--accent-strong); color: var(--accent-ink); }
  .btn.primary:hover { filter: brightness(1.1); }
  .btn.danger { background: var(--danger); border-color: var(--danger); color: var(--danger-ink); }
  .btn.danger:hover { filter: brightness(1.08); }
  .btn[disabled] { opacity: .6; cursor: default; }
  .link-btn { font: inherit; font-size: 13.5px; font-weight: 600; padding: 6px 8px; border: 0; border-radius: 6px; background: none; color: var(--accent-strong); cursor: pointer; }
  .link-btn:hover { background: var(--surface-2); }
  .link-btn.del { color: var(--danger); }

  /* List */
  .list { list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  .row {
    display: grid; align-items: center; gap: 8px 18px; padding: 14px 18px; border-top: 1px solid var(--line);
    grid-template-columns: minmax(0, 2fr) minmax(0, 1.7fr) minmax(0, 1.1fr) 140px auto;
  }
  .row.head { background: var(--surface-2); border-top: 0; padding-block: 10px; font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .row.item.editable { cursor: pointer; }
  .row.item.editable:hover { background: color-mix(in srgb, var(--surface-2) 55%, var(--surface)); }
  .row > * { min-width: 0; }
  .name { font-family: var(--font-display); font-size: 17px; font-weight: 600; line-height: 1.25; overflow-wrap: anywhere; }
  .sub, .line { display: block; font-size: 13.5px; color: var(--muted); overflow-wrap: anywhere; }
  .line { color: var(--fg); }
  .line + .line { color: var(--muted); }
  .c-contact a { color: var(--accent-strong); font-size: 13.5px; text-decoration: none; overflow-wrap: anywhere; }
  .c-contact a:hover { text-decoration: underline; }
  .plan { font-weight: 600; display: block; }
  .price { font-size: 13.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .c-actions { display: flex; gap: 2px; justify-content: flex-end; }
  .dim { color: var(--muted); }

  .pill { display: inline-flex; align-items: center; gap: 7px; padding: 3px 11px 3px 9px; border-radius: 99px; font-size: 12.5px; font-weight: 600; white-space: nowrap; }
  .pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
  .s-lead { background: var(--neutral-bg); color: var(--neutral-fg); }
  .s-demo { background: var(--info-bg); color: var(--info-fg); }
  .s-beta { background: var(--warn-bg); color: var(--warn-fg); }
  .s-active { background: var(--ok-bg); color: var(--ok-fg); }
  .s-paused { background: var(--pause-bg); color: var(--pause-fg); }

  .empty { padding: 44px 24px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
  .empty h2 { margin: 0 0 6px; font-family: var(--font-display); font-size: 21px; font-weight: 600; }
  .empty p { margin: 0 0 18px; color: var(--muted); max-width: 52ch; }
  .banner { padding: 12px 14px; border-radius: 10px; background: var(--warn-bg); color: var(--warn-fg); margin-bottom: 14px; font-size: 14px; }

  @media (max-width: 760px) {
    .row.head { display: none; }
    .row { grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "name status" "contact contact" "plan actions"; padding: 14px 16px; }
    .c-name { grid-area: name; }
    .c-status { grid-area: status; }
    .c-contact { grid-area: contact; }
    .c-plan { grid-area: plan; }
    .c-actions { grid-area: actions; }
  }

  /* Dialogs */
  dialog {
    border: 1px solid var(--line); border-radius: 14px; padding: 0; background: var(--surface); color: var(--fg);
    box-shadow: var(--shadow); width: min(660px, calc(100vw - 32px)); max-height: calc(100dvh - 32px);
  }
  dialog.small { width: min(440px, calc(100vw - 32px)); }
  dialog::backdrop { background: rgba(6, 14, 17, .55); }
  dialog[open] { display: flex; flex-direction: column; }
  dialog form { display: flex; flex-direction: column; min-height: 0; flex: 1; }
  .sheet-head { padding: 20px 22px 0; }
  .sheet-head h2 { margin: 0; font-family: var(--font-display); font-size: 22px; font-weight: 600; }
  .sheet-head p { margin: 4px 0 0; color: var(--muted); font-size: 14px; }
  .sheet-body { padding: 18px 22px; overflow: auto; min-height: 0; }
  .sheet-foot { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 10px; padding: 14px 22px 18px; border-top: 1px solid var(--line); }
  .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 16px; }
  .full { grid-column: 1 / -1; }
  .field label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 5px; }
  .field .hint { margin: 5px 0 0; font-size: 12.5px; color: var(--muted); }
  .form-err { margin: 14px 0 0; padding: 10px 12px; border-radius: 8px; background: var(--pause-bg); color: var(--pause-fg); font-size: 14px; }
  @media (max-width: 560px) { .grid { grid-template-columns: minmax(0, 1fr); } .sheet-head, .sheet-body, .sheet-foot { padding-left: 18px; padding-right: 18px; } }

  /* Toast */
  .toast-host {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 50; display: flex; justify-content: center; pointer-events: none;
    padding: 0 max(16px, env(safe-area-inset-right, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  }
  #toast { pointer-events: auto; background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 14px; font-weight: 500; box-shadow: var(--shadow); }

  @media (prefers-reduced-motion: reduce) { .bar i { transition: none; } }
</style>

<div class="wrap">
  <header class="top">
    <div>
      <p class="eyebrow">VINIT SaaS Solutions</p>
      <h1>Clients</h1>
    </div>
    <button id="btn-new" class="btn primary" type="button" hidden>New client</button>
  </header>

  <section class="overview" aria-label="Overview">
    <div class="stat"><span class="k">Clients</span><span class="v" id="s-total">0</span></div>
    <div class="stat"><span class="k">Active</span><span class="v" id="s-active">0</span></div>
    <div class="stat" title="Monthly price of active clients"><span class="k">MRR</span><span class="v" id="s-mrr">0 RON</span></div>
    <div class="be">
      <div class="be-top"><span>Monthly break-even</span><span id="be-text"></span></div>
      <div class="bar" role="img" aria-label="MRR compared with monthly costs"><i id="be-fill"></i></div>
    </div>
  </section>

  <div class="toolbar">
    <div class="search"><input id="q" type="search" placeholder="Search salon, owner, city, domain, phone" aria-label="Search clients" autocomplete="off"></div>
    <div class="sort"><label for="sort">Sort</label>
      <select id="sort"><option value="newest">Newest first</option><option value="name">Salon A to Z</option></select>
    </div>
    <div class="chips" id="chips" role="group" aria-label="Filter by status"></div>
  </div>

  <div id="banner" class="banner" hidden></div>
  <div id="list-host"></div>
</div>

<dialog id="form-dialog" aria-labelledby="form-title">
  <form id="client-form" novalidate>
    <div class="sheet-head">
      <h2 id="form-title">New client</h2>
      <p id="form-sub">Salon details, package and status.</p>
    </div>
    <div class="sheet-body">
      <div class="grid">
        <div class="field full"><label for="f-salon">Salon name *</label><input id="f-salon" type="text" required maxlength="120" autocomplete="off"></div>
        <div class="field"><label for="f-owner">Owner / contact person</label><input id="f-owner" type="text" maxlength="120" autocomplete="off"></div>
        <div class="field"><label for="f-city">City</label><input id="f-city" type="text" maxlength="80" autocomplete="off"></div>
        <div class="field"><label for="f-phone">Phone</label><input id="f-phone" type="tel" maxlength="40" autocomplete="off"></div>
        <div class="field"><label for="f-email">Email</label><input id="f-email" type="email" maxlength="160" autocomplete="off"></div>
        <div class="field full"><label for="f-domain">Domain</label><input id="f-domain" type="text" maxlength="120" placeholder="salonname.ro" autocomplete="off"></div>
        <div class="field"><label for="f-plan">Package</label>
          <select id="f-plan">
            <option value="standard">Standard Barbershop (150 RON)</option>
            <option value="premium">Premium Brand (200 RON)</option>
            <option value="custom">Custom</option>
          </select>
        </div>
        <div class="field"><label for="f-price">Monthly price (RON)</label><input id="f-price" type="number" min="0" step="10" inputmode="numeric">
          <p class="hint">Counts toward MRR once the client is Active.</p>
        </div>
        <div class="field"><label for="f-status">Status</label><select id="f-status"></select></div>
        <div class="field"><label for="f-since">Client since</label><input id="f-since" type="date"></div>
        <div class="field full"><label for="f-notes">Notes</label><textarea id="f-notes" maxlength="2000" placeholder="Barbers, preferences, feedback from the demo"></textarea></div>
      </div>
      <p id="form-err" class="form-err" role="alert" hidden></p>
    </div>
    <div class="sheet-foot">
      <button type="button" class="btn" id="form-cancel">Cancel</button>
      <button type="submit" class="btn primary" id="form-save">Save client</button>
    </div>
  </form>
</dialog>

<dialog id="del-dialog" class="small" aria-labelledby="del-title">
  <form id="del-form" method="dialog">
    <div class="sheet-head"><h2 id="del-title">Delete client?</h2></div>
    <div class="sheet-body"><p id="del-text" style="margin:0"></p><p id="del-err" class="form-err" role="alert" hidden></p></div>
    <div class="sheet-foot">
      <button type="button" class="btn" id="del-cancel">Keep client</button>
      <button type="submit" class="btn danger" id="del-confirm">Delete</button>
    </div>
  </form>
</dialog>

<div class="toast-host"><div id="toast" role="status" aria-live="polite" hidden></div></div>

<script>
(function () {
  var PLANS = {
    standard: { label: "Standard Barbershop", price: 150 },
    premium: { label: "Premium Brand", price: 200 },
    custom: { label: "Custom", price: 0 }
  };
  var STATUSES = [["lead", "Lead"], ["demo", "Demo booked"], ["beta", "Beta (free)"], ["active", "Active"], ["paused", "Paused"]];
  var BREAK_EVEN = 6380;

  var $ = function (id) { return document.getElementById(id); };
  var state = { clients: [], loaded: false, failed: false, slow: false, unavailable: false, canWrite: true, q: "", status: "all", sort: "newest", editingId: null, deletingId: null, busy: false };
  var db = null;
  var chipEls = {};

  function h(tag, props) {
    var el = document.createElement(tag);
    props = props || {};
    Object.keys(props).forEach(function (k) {
      var v = props[k];
      if (v == null || v === false) return;
      if (k === "class") el.className = v;
      else if (k === "text") el.textContent = v;
      else if (k.slice(0, 2) === "on") el.addEventListener(k.slice(2), v);
      else el.setAttribute(k, v === true ? "" : v);
    });
    for (var i = 2; i < arguments.length; i++) {
      var kid = arguments[i];
      if (kid == null || kid === false) continue;
      el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
    }
    return el;
  }
  function norm(s) { return String(s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, ""); }
  function money(n) { return new Intl.NumberFormat("ro-RO", { maximumFractionDigits: 0 }).format(n || 0) + " RON"; }
  function fmtDate(s) {
    if (!s) return "";
    var d = new Date(s + "T00:00:00");
    return isNaN(d) ? "" : d.toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" });
  }
  function cleanDomain(d) {
    var v = String(d || "").trim().replace(/^https?:\/\//i, "").replace(/\/+$/, "");
    return /^[a-z0-9]([a-z0-9-]*[a-z0-9])?(\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+$/i.test(v) ? v : null;
  }
  var toastTimer;
  function toast(msg) {
    var t = $("toast");
    t.textContent = msg; t.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.hidden = true; }, 3200);
  }

  /* ---------- rendering ---------- */
  function visible() {
    var q = norm(state.q).trim();
    var arr = state.clients.filter(function (c) {
      if (state.status !== "all" && c.status !== state.status) return false;
      if (!q) return true;
      return norm([c.salon, c.owner, c.city, c.domain, c.phone, c.email].join(" ")).indexOf(q) !== -1;
    });
    arr.sort(function (a, b) {
      if (state.sort === "name") return String(a.salon || "").localeCompare(String(b.salon || ""), "ro");
      return String(b.createdAt || "").localeCompare(String(a.createdAt || ""));
    });
    return arr;
  }

  function renderOverview() {
    var active = state.clients.filter(function (c) { return c.status === "active"; });
    var mrr = active.reduce(function (s, c) { return s + (Number(c.price) || 0); }, 0);
    $("s-total").textContent = state.clients.length;
    $("s-active").textContent = active.length;
    $("s-mrr").textContent = money(mrr);
    $("be-text").textContent = money(mrr) + " of " + money(BREAK_EVEN);
    $("be-fill").style.width = Math.min(100, (mrr / BREAK_EVEN) * 100) + "%";
  }

  function buildChips() {
    var box = $("chips");
    [["all", "All"]].concat(STATUSES).forEach(function (s) {
      var n = h("span", { class: "n" });
      var b = h("button", { type: "button", class: "chip", "aria-pressed": s[0] === "all" ? "true" : "false", onclick: function () { state.status = s[0]; renderChips(); renderList(); } }, s[1], n);
      chipEls[s[0]] = { btn: b, n: n };
      box.append(b);
    });
  }
  function renderChips() {
    Object.keys(chipEls).forEach(function (k) {
      var count = k === "all" ? state.clients.length : state.clients.filter(function (c) { return c.status === k; }).length;
      chipEls[k].n.textContent = count;
      chipEls[k].btn.setAttribute("aria-pressed", state.status === k ? "true" : "false");
    });
  }

  function renderBanner() {
    var b = $("banner"), msg = "";
    if (state.unavailable) msg = "Client storage isn't available in this view. Open the page in claude.ai while signed in to add and edit clients.";
    else if (state.failed) msg = "Clients couldn't be loaded. Reload the page to try again.";
    else if (state.slow && !state.loaded) msg = "Still trying to reach client storage. Your clients will appear as soon as it answers.";
    else if (!state.canWrite) msg = "You have view-only access. Ask the owner for edit access to change clients.";
    b.hidden = !msg; b.textContent = msg;
  }

  function emptyBox(title, text, btn) {
    return h("div", { class: "empty" }, h("h2", { text: title }), h("p", { text: text }), btn || null);
  }

  function renderList() {
    var host = $("list-host");
    host.textContent = "";
    if (state.unavailable) return;
    if (!state.loaded) {
      if (!state.failed) host.append(emptyBox("Loading clients", "Fetching your client list.", null));
      return;
    }
    if (state.clients.length === 0) {
      host.append(emptyBox("No clients yet", "Add the first salon you onboard. Each client keeps its contact details, package, domain and status here.",
        state.canWrite ? h("button", { class: "btn primary", type: "button", onclick: function () { openForm(null); } }, "Add your first client") : null));
      return;
    }
    var rows = visible();
    if (rows.length === 0) {
      host.append(emptyBox("No clients match", "Try a different search or status filter.",
        h("button", { class: "btn", type: "button", onclick: function () { state.q = ""; state.status = "all"; $("q").value = ""; renderChips(); renderList(); } }, "Clear filters")));
      return;
    }
    var ul = h("ul", { class: "list" },
      h("li", { class: "row head", "aria-hidden": "true" }, h("span", { text: "Salon" }), h("span", { text: "Contact" }), h("span", { text: "Package" }), h("span", { text: "Status" }), h("span")));
    rows.forEach(function (c) { ul.append(rowEl(c)); });
    host.append(ul);
  }

  function rowEl(c) {
    var st = STATUSES.filter(function (s) { return s[0] === c.status; })[0] || STATUSES[0];
    var plan = PLANS[c.plan] || PLANS.custom;
    var price = Number(c.price) || 0;
    var dom = cleanDomain(c.domain);
    var sub = [c.owner, c.city].filter(Boolean).join(" · ");
    var since = fmtDate(c.since);

    var contact = h("div", { class: "c-contact" },
      c.phone ? h("span", { class: "line", text: c.phone }) : null,
      c.email ? h("span", { class: "line", text: c.email }) : null,
      dom ? h("a", { href: "https://" + dom, target: "_blank", rel: "noopener noreferrer", text: dom }) : (c.domain ? h("span", { class: "line", text: c.domain }) : null),
      (!c.phone && !c.email && !c.domain) ? h("span", { class: "dim", text: "No contact details" }) : null);

    var actions = h("div", { class: "c-actions" });
    if (state.canWrite) {
      actions.append(
        h("button", { type: "button", class: "link-btn", "aria-label": "Edit " + (c.salon || "client"), onclick: function () { openForm(c.id); } }, "Edit"),
        h("button", { type: "button", class: "link-btn del", "aria-label": "Delete " + (c.salon || "client"), onclick: function () { openDelete(c.id); } }, "Delete"));
    }

    var li = h("li", { class: "row item" + (state.canWrite ? " editable" : "") },
      h("div", { class: "c-name" },
        h("span", { class: "name", text: c.salon || "Untitled salon" }),
        sub ? h("span", { class: "sub", text: sub }) : null,
        since ? h("span", { class: "sub", text: "Client since " + since }) : null),
      contact,
      h("div", { class: "c-plan" }, h("span", { class: "plan", text: plan.label }), h("span", { class: "price", text: price ? money(price) + " / month" : "No monthly fee" })),
      h("div", { class: "c-status" }, h("span", { class: "pill s-" + st[0], text: st[1] })),
      actions);
    if (state.canWrite) li.addEventListener("click", function (e) { if (e.target.closest("a, button")) return; openForm(c.id); });
    return li;
  }

  function render() {
    renderOverview(); renderChips(); renderBanner(); renderList();
    $("btn-new").hidden = !(state.canWrite && !state.unavailable && state.loaded);
  }

  /* ---------- form ---------- */
  function todayISO() { return new Date().toLocaleDateString("sv-SE"); }
  function openForm(id) {
    state.editingId = id || null;
    var c = id ? state.clients.filter(function (x) { return x.id === id; })[0] : null;
    if (id && !c) return;
    $("form-title").textContent = c ? "Edit client" : "New client";
    $("form-sub").textContent = c ? "Changes are saved to the client list." : "Salon details, package and status.";
    $("f-salon").value = c ? (c.salon || "") : "";
    $("f-owner").value = c ? (c.owner || "") : "";
    $("f-city").value = c ? (c.city || "") : "";
    $("f-phone").value = c ? (c.phone || "") : "";
    $("f-email").value = c ? (c.email || "") : "";
    $("f-domain").value = c ? (c.domain || "") : "";
    $("f-plan").value = c ? (PLANS[c.plan] ? c.plan : "custom") : "standard";
    $("f-price").value = c ? (Number(c.price) || 0) : PLANS.standard.price;
    $("f-status").value = c ? (c.status || "lead") : "lead";
    $("f-since").value = c ? (c.since || "") : todayISO();
    $("f-notes").value = c ? (c.notes || "") : "";
    $("form-err").hidden = true;
    setSaving(false);
    $("form-dialog").showModal();
    $("f-salon").focus();
  }
  function setSaving(on) {
    state.busy = on;
    $("form-save").disabled = on;
    $("form-save").textContent = on ? "Saving" : "Save client";
  }
  function errText(e) {
    var code = e && e.code;
    if (code === "quota_exceeded") return "Storage is full. Delete some clients and try again.";
    if (code === "invalid_argument") return "This change was refused. You may not have permission to edit clients.";
    if (code === "revoked") return "Your access to this page changed. Reload the page.";
    return "That didn't save. Check your connection and try again.";
  }
  async function saveClient(ev) {
    ev.preventDefault();
    if (!db || state.busy) return;
    var form = $("client-form");
    if (!form.reportValidity()) return;
    var now = new Date().toISOString();
    var data = {
      salon: $("f-salon").value.trim(),
      owner: $("f-owner").value.trim(),
      city: $("f-city").value.trim(),
      phone: $("f-phone").value.trim(),
      email: $("f-email").value.trim(),
      domain: $("f-domain").value.trim(),
      plan: $("f-plan").value,
      price: Math.max(0, Number($("f-price").value) || 0),
      status: $("f-status").value,
      since: $("f-since").value,
      notes: $("f-notes").value.trim(),
      updatedAt: now
    };
    if (!data.salon) { $("f-salon").focus(); return; }
    setSaving(true);
    try {
      if (state.editingId) {
        var old = state.clients.filter(function (x) { return x.id === state.editingId; })[0] || {};
        var merged = Object.assign({}, old, data);
        delete merged.id;
        await db.doc("clients/" + state.editingId).set(merged);
        toast("Saved " + data.salon);
      } else {
        data.createdAt = now;
        await db.collection("clients").add(data);
        toast("Added " + data.salon);
      }
      $("form-dialog").close();
      setSaving(false);
    } catch (e) {
      setSaving(false);
      $("form-err").textContent = errText(e);
      $("form-err").hidden = false;
    }
  }

  /* ---------- delete ---------- */
  function openDelete(id) {
    var c = state.clients.filter(function (x) { return x.id === id; })[0];
    if (!c) return;
    state.deletingId = id;
    $("del-text").textContent = "“" + (c.salon || "This client") + "” and all of its details will be removed. This can't be undone.";
    $("del-err").hidden = true;
    $("del-confirm").disabled = false;
    $("del-dialog").showModal();
  }
  async function confirmDelete(ev) {
    ev.preventDefault();
    if (!db || !state.deletingId) return;
    var id = state.deletingId;
    var c = state.clients.filter(function (x) { return x.id === id; })[0];
    $("del-confirm").disabled = true;
    try {
      await db.doc("clients/" + id).delete();
      $("del-dialog").close();
      state.deletingId = null;
      toast("Deleted " + ((c && c.salon) || "client"));
    } catch (e) {
      $("del-confirm").disabled = false;
      $("del-err").textContent = errText(e);
      $("del-err").hidden = false;
    }
  }

  /* ---------- wiring ---------- */
  STATUSES.forEach(function (s) { $("f-status").append(h("option", { value: s[0], text: s[1] })); });
  buildChips();
  $("btn-new").addEventListener("click", function () { openForm(null); });
  $("client-form").addEventListener("submit", saveClient);
  $("form-cancel").addEventListener("click", function () { $("form-dialog").close(); });
  $("del-form").addEventListener("submit", confirmDelete);
  $("del-cancel").addEventListener("click", function () { $("del-dialog").close(); });
  $("f-plan").addEventListener("change", function () {
    var p = PLANS[$("f-plan").value];
    if ($("f-plan").value !== "custom") $("f-price").value = p.price;
  });
  $("q").addEventListener("input", function (e) { state.q = e.target.value; renderList(); });
  $("sort").addEventListener("change", function (e) { state.sort = e.target.value; renderList(); });
  render();

  async function init() {
    var c = window.claude;
    if (!c || !c.use) { state.unavailable = true; render(); return; }
    try {
      var user = await c.use("user");
      if (user && typeof user.can === "function") {
        var w = await user.can("data.write");
        if (w === false) state.canWrite = false;
      }
    } catch (e) {}
    try { db = await c.use("db"); } catch (e) { db = null; }
    if (!db) { state.unavailable = true; render(); return; }
    var timer = setTimeout(function () { if (!state.loaded) { state.slow = true; renderBanner(); } }, 10000);
    db.collection("clients").onSnapshot(function (snap) {
      state.clients = snap.docs.map(function (d) { return Object.assign({ id: d.id }, d.data()); });
      if (!snap.metadata.fromCache || snap.size > 0 || state.loaded) { state.loaded = true; clearTimeout(timer); state.slow = false; }
      render();
    }, function () {
      clearTimeout(timer); state.failed = true; state.loaded = false; render();
    });
  }
  init();
})();
</script>

</body></html>
