# Serves the Angular app and forwards /api to the API container (same origin: no CORS, cookies just work).
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;

  # Uploads are limited to 50 MB by the API; leave a little room for the form fields.
  client_max_body_size 55m;

  include /etc/nginx/snippets/security-headers.conf;

  location /api/ {
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
  }

  # Hashed build files (main-L57LPY7K.js…) never change: cache them for a year.
  location ~* "-[A-Z0-9]{8}\.(js|css)$" {
    expires 1y;
    add_header Cache-Control "public, immutable";
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri =404;
  }

  # Everything else is the single-page app: always revalidate index.html so updates show up.
  location / {
    add_header Cache-Control "no-cache";
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri $uri/ /index.html;
  }
}
